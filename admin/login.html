    <h1>Acceso privado</h1>
    <p class="sub">Panel de gestión de clientes — Green Lake</p>

    <div class="form-error" id="error"></div>

    <form class="admin-form" id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;" id="submit-btn">Entrar</button>
    </form>
  </div>
</div>

<script>
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) window.location.href = "calendario.html";
  })();

  const form = document.getElementById("login-form");
  const errorEl = document.getElementById("error");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.classList.remove("visible");
    submitBtn.disabled = true;
    submitBtn.textContent = "Entrando…";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      errorEl.textContent = "No se ha podido iniciar sesión. Revisa el email y la contraseña.";
      errorEl.classList.add("visible");
      submitBtn.disabled = false;
      submitBtn.textContent = "Entrar";
      return;
    }

    window.location.href = "calendario.html";
  });
</script>

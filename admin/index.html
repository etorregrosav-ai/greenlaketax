    <div class="user-chip"><span class="dot"></span><span id="user-email">…</span></div>
    <button class="signout">Cerrar sesión</button>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <div>
        <h1>Clientes</h1>
        <p class="sub">Da de alta clientes y controla sus obligaciones fiscales.</p>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-outline" id="export-csv-btn">Exportar CSV</button>
        <button class="btn btn-primary" id="new-client-btn">+ Nuevo cliente</button>
      </div>
    </div>

    <div class="admin-card" id="new-client-card" style="display:none;">
      <h3 style="margin-bottom:18px;">Nuevo cliente</h3>
      <form class="admin-form" id="new-client-form">
        <div class="field-row">
          <div class="field">
            <label for="c-name">Nombre / Razón social</label>
            <input type="text" id="c-name" required>
          </div>
          <div class="field">
            <label for="c-number">Nº de cliente</label>
            <input type="text" id="c-number" placeholder="p.ej. 0042">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="c-taxid">NIF / NIE / CIF</label>
            <input type="text" id="c-taxid">
          </div>
          <div class="field">
            <label for="c-email">Email de contacto</label>
            <input type="email" id="c-email">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="c-type">Tipo</label>
            <select id="c-type" required>
              <option value="fisica">Persona física</option>
              <option value="juridica">Persona jurídica</option>
            </select>
          </div>
          <div class="field">
            <label for="c-residency">Residencia fiscal</label>
            <select id="c-residency" required>
              <option value="residente">Residente</option>
              <option value="no_residente">No residente</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="c-notes">Notas (opcional)</label>
          <textarea id="c-notes" rows="2"></textarea>
        </div>
        <div class="field" style="display:flex; align-items:center; gap:10px;">
          <input type="checkbox" id="c-isself" style="width:auto;">
          <label for="c-isself" style="margin:0;">Esta ficha es la mía (mi propia actividad como autónomo)</label>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Crear cliente</button>
          <button type="button" class="btn btn-outline" id="cancel-new">Cancelar</button>
        </div>
      </form>
    </div>

    <div class="admin-card">
      <div class="table-wrap">
        <table class="client-table" id="client-table" style="display:none;">
          <thead>
            <tr><th>Nº</th><th>Nombre</th><th>Estado</th><th>Tipo</th><th>Residencia</th><th>NIF/CIF</th></tr>
          </thead>
          <tbody id="client-tbody"></tbody>
        </table>
        <div class="empty-state" id="empty-state">Todavía no has dado de alta ningún cliente.</div>
      </div>
    </div>
  </main>
</div>

<script src="admin-auth.js"></script>
<script src="admin-ui.js"></script>
<script src="deadlines.js"></script>
<script>
  (async () => {
    const session = await requireSession();
    if (!session) return;
    await loadClients();
  })();

  let lastClients = [];
  let lastStatusByClient = {};

  async function loadClients() {
    const { data, error } = await supabaseClient
      .from("clients")
      .select("*")
      .order("is_self", { ascending: false })
      .order("created_at", { ascending: false });

    const tbody = document.getElementById("client-tbody");
    const table = document.getElementById("client-table");
    const empty = document.getElementById("empty-state");

    if (error) {
      empty.textContent = "Error al cargar los clientes: " + error.message;
      return;
    }

    if (!data || data.length === 0) {
      table.style.display = "none";
      empty.style.display = "block";
      return;
    }

    table.style.display = "table";
    empty.style.display = "none";
    tbody.innerHTML = "";

    const statusByClient = await computeAllStatuses(data.map((c) => c.id));
    lastClients = data;
    lastStatusByClient = statusByClient;

    data.forEach((c) => {
      const tr = document.createElement("tr");
      tr.className = "clickable";
      tr.addEventListener("click", () => {
        window.location.href = "cliente.html?id=" + c.id;
      });
      const status = statusByClient[c.id] || "ok";
      const statusLabel = status === "atrasado" ? "Atrasado" : status === "atencion" ? "Atención" : "Al día";
      tr.innerHTML = `
        <td style="color:var(--ink-faint); font-weight:600;">${escapeHtml(c.client_number || "—")}</td>
        <td class="name">${escapeHtml(c.name)}${c.is_self ? ' <span class="badge residente">Tú</span>' : ""}</td>
        <td><span class="badge status-${status}">${statusLabel}</span></td>
        <td><span class="badge ${c.person_type}">${c.person_type === "fisica" ? "Física" : "Jurídica"}</span></td>
        <td><span class="badge ${c.residency}">${c.residency === "residente" ? "Residente" : "No residente"}</span></td>
        <td>${escapeHtml(c.tax_id || "—")}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  async function computeAllStatuses(clientIds) {
    const result = {};
    if (clientIds.length === 0) return result;

    const [{ data: obligations }, { data: filings }] = await Promise.all([
      supabaseClient.from("client_obligations").select("client_id, obligation_types(*)").eq("active", true),
      supabaseClient.from("obligation_filings").select("client_id, obligation_type_id, period_label").eq("filed", true),
    ]);

    const filedSet = new Set((filings || []).map((f) => f.client_id + "|" + f.obligation_type_id + "|" + f.period_label));
    const byClient = {};
    (obligations || []).forEach((o) => {
      if (!byClient[o.client_id]) byClient[o.client_id] = [];
      byClient[o.client_id].push(o);
    });

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    clientIds.forEach((id) => {
      result[id] = computeClientStatus(byClient[id] || [], filedSet, id, today, 15);
    });
    return result;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById("export-csv-btn").addEventListener("click", () => {
    if (lastClients.length === 0) {
      toast("No hay clientes que exportar.", "error");
      return;
    }
    const statusLabelOf = (s) => (s === "atrasado" ? "Atrasado" : s === "atencion" ? "Atención" : "Al día");
    const headers = ["Nº", "Nombre", "Estado", "Tipo", "Residencia", "NIF/CIF", "Email", "Notas"];
    const rows = lastClients.map((c) => [
      c.client_number || "",
      c.name,
      statusLabelOf(lastStatusByClient[c.id] || "ok"),
      c.person_type === "fisica" ? "Física" : "Jurídica",
      c.residency === "residente" ? "Residente" : "No residente",
      c.tax_id || "",
      c.email || "",
      c.notes || "",
    ]);
    downloadCSV("greenlake-clientes.csv", headers, rows);
  });

  const newBtn = document.getElementById("new-client-btn");
  const newCard = document.getElementById("new-client-card");
  const cancelBtn = document.getElementById("cancel-new");

  newBtn.addEventListener("click", () => {
    newCard.style.display = newCard.style.display === "none" ? "block" : "none";
  });
  cancelBtn.addEventListener("click", () => {
    newCard.style.display = "none";
  });

  document.getElementById("new-client-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("c-name").value.trim();
    const client_number = document.getElementById("c-number").value.trim();
    const email = document.getElementById("c-email").value.trim();
    const tax_id = document.getElementById("c-taxid").value.trim();
    const person_type = document.getElementById("c-type").value;
    const residency = document.getElementById("c-residency").value;
    const notes = document.getElementById("c-notes").value.trim();
    const is_self = document.getElementById("c-isself").checked;

    const { data, error } = await supabaseClient
      .from("clients")
      .insert([{ name, client_number, email, tax_id, person_type, residency, notes, is_self }])
      .select()
      .single();

    if (error) {
      toast("Error al crear el cliente: " + error.message, "error");
      return;
    }

    window.location.href = "cliente.html?id=" + data.id;
  });
</script>

</body>
</html>

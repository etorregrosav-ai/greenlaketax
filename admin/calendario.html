823-5.106-2.352-1.447-0.102 0.705 1.679 5.874-1.055 5.101-2.833-0.807-2.42-12.798-3.788-12.673-2.389 0.219-0.306 10.836-1.019 12.176-0.217 0.408-3.681-3.516-3.902-4.458-0.979-4.16-1.428-2.612-2.589 0.034-1.537 3.502 10.289 9.671 12.422 10.911 1.701 0.988 3.098 1.841 3.681 3.817 0.509 1.725 1.125 4.088-0.047 5.711-0.834 1.155-3.046 1.791-3.046 3.467"/></svg>Green Lake</a>
    <nav class="admin-nav">
      <a href="calendario.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>Calendario</a>

    <div class="user-chip"><span class="dot"></span><span id="user-email">…</span></div>
    <button class="signout">Cerrar sesión</button>

  <main class="admin-main">
    <div class="admin-header">
      <div>
        <h1>Calendario</h1>
        <p class="sub">Todas las obligaciones fiscales de tus clientes, mes a mes.</p>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <button class="btn btn-sm btn-outline" id="prev-month">←</button>
        <h2 id="month-label" style="margin:0; font-size:1.15rem; min-width:170px; text-align:center;">—</h2>
        <button class="btn btn-sm btn-outline" id="next-month">→</button>
        <button class="btn btn-sm btn-outline" id="today-btn">Hoy</button>
      </div>
    </div>

    <div class="stat-grid" id="stat-grid" style="display:none;">
      <div class="stat-tile primary">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></div>
        <span class="stat-value" id="stat-total">0</span>
        <span class="stat-label">Plazos este mes</span>
      </div>
      <div class="stat-tile warn">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></div>
        <span class="stat-value" id="stat-pending">0</span>
        <span class="stat-label">Pendientes</span>
      </div>
      <div class="stat-tile">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg></div>
        <span class="stat-value" id="stat-filed">0</span>
        <span class="stat-label">Presentados</span>
      </div>
      <div class="stat-tile">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15 14.2c2.2.3 4 2 4 4.8"/></svg></div>
        <span class="stat-value" id="stat-clients">0</span>
        <span class="stat-label">Clientes implicados</span>
      </div>
    </div>

    <div class="admin-card">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:12px;">
        <div id="calendar-summary" style="color:var(--ink-soft); font-size:0.94rem;"></div>
        <div class="lang-switch" style="border:1px solid var(--line);">
          <a href="#" id="view-list-btn">Lista</a>
          <a href="#" id="view-table-btn" class="active">Tabla</a>
        </div>
      </div>
      <div id="calendar-container"><div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div></div>
    </div>
  </main>
</div>

<script src="admin-auth.js"></script>
<script src="admin-ui.js"></script>
<script src="deadlines.js"></script>
<script>
  let viewDate = new Date();
  viewDate.setDate(1);
  let currentView = "table";
  let lastMatrixCells = []; // para poder togglear sin recargar

  (async () => {
    const session = await requireSession();
    if (!session) return;
    await renderMonth();
  })();

  document.getElementById("prev-month").addEventListener("click", () => {
    viewDate.setMonth(viewDate.getMonth() - 1);
    renderMonth();
  });
  document.getElementById("next-month").addEventListener("click", () => {
    viewDate.setMonth(viewDate.getMonth() + 1);
    renderMonth();
  });
  document.getElementById("today-btn").addEventListener("click", () => {
    viewDate = new Date();
    viewDate.setDate(1);
    renderMonth();
  });

  document.getElementById("view-list-btn").addEventListener("click", (e) => {
    e.preventDefault();
    setView("list");
  });
  document.getElementById("view-table-btn").addEventListener("click", (e) => {
    e.preventDefault();
    setView("table");
  });

  function setView(view) {
    currentView = view;
    document.getElementById("view-list-btn").classList.toggle("active", view === "list");
    document.getElementById("view-table-btn").classList.toggle("active", view === "table");
    renderMonth();
  }

  async function renderMonth() {
    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    document.getElementById("month-label").textContent =
      MONTH_NAMES_ES[month].charAt(0).toUpperCase() + MONTH_NAMES_ES[month].slice(1) + " " + year;

    const container = document.getElementById("calendar-container");
    const summary = document.getElementById("calendar-summary");
    container.innerHTML = "<div class='skeleton-row'></div><div class='skeleton-row'></div><div class='skeleton-row'></div>";
    summary.textContent = "";

    const { data: clients, error: clientsError } = await supabaseClient.from("clients").select("id, name, is_self");
    if (clientsError) { container.textContent = "Error: " + clientsError.message; return; }
    if (!clients || clients.length === 0) {
      container.innerHTML = "<div class='empty-state'>Todavía no has dado de alta ningún cliente. <a href='index.html' style='color:var(--lake-green);font-weight:600;'>Ir a Clientes</a></div>";
      return;
    }

    const { data: obligations, error: oblError } = await supabaseClient
      .from("client_obligations")
      .select("*, obligation_types(*)")
      .eq("active", true);
    if (oblError) { container.textContent = "Error: " + oblError.message; return; }

    const clientsById = {};
    clients.forEach((c) => { clientsById[c.id] = c; });

    let rows = [];
    const matrixMap = new Map(); // key "clientId|obligationId|period" -> {client, obligation, period}

    (obligations || []).forEach((co) => {
      const ot = co.obligation_types;
      const client = clientsById[co.client_id];
      if (!ot || !client) return;

      getInstancesForMonth(ot, year, month).forEach((inst) => {
        if (inst.domiciliacion_end && inst.domiciliacion_end.getFullYear() === year && inst.domiciliacion_end.getMonth() === month) {
          rows.push({ date: inst.domiciliacion_end, client, obligation: ot, period: inst.period_label, kind: "Domiciliación" });
        }
        if (inst.presentacion_end.getFullYear() === year && inst.presentacion_end.getMonth() === month) {
          rows.push({ date: inst.presentacion_end, client, obligation: ot, period: inst.period_label, kind: inst.domiciliacion_end ? "Presentación (NRC)" : "Presentación" });
        }
        const key = client.id + "|" + ot.id + "|" + inst.period_label;
        if (!matrixMap.has(key)) matrixMap.set(key, { client, obligation: ot, period: inst.period_label });
      });
    });

    rows.sort((a, b) => a.date - b.date || a.client.name.localeCompare(b.client.name));

    const statGrid = document.getElementById("stat-grid");

    if (rows.length === 0) {
      statGrid.style.display = "none";
      summary.textContent = "Sin obligaciones ese mes.";
      container.innerHTML = "<div class='empty-state'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.5'><rect x='3' y='5' width='18' height='16' rx='2'/><path d='M16 3v4M8 3v4M3 10h18'/><path d='m9 15 2 2 4-4'/></svg>No hay plazos de domiciliación ni presentación en " + MONTH_NAMES_ES[month] + ".</div>";
      return;
    }

    summary.textContent = rows.length + " plazo" + (rows.length === 1 ? "" : "s") + " este mes, de " +
      new Set(rows.map((r) => r.client.id)).size + " cliente" + (new Set(rows.map((r) => r.client.id)).size === 1 ? "" : "s") + ".";

    const cells = Array.from(matrixMap.values());
    const { data: filings } = await supabaseClient
      .from("obligation_filings")
      .select("client_id, obligation_type_id, period_label, filed")
      .eq("filed", true);
    const filedSetForStats = new Set((filings || []).map((f) => f.client_id + "|" + f.obligation_type_id + "|" + f.period_label));
    const filedCount = cells.filter((c) => filedSetForStats.has(c.client.id + "|" + c.obligation.id + "|" + c.period)).length;

    document.getElementById("stat-total").textContent = cells.length;
    document.getElementById("stat-pending").textContent = cells.length - filedCount;
    document.getElementById("stat-filed").textContent = filedCount;
    document.getElementById("stat-clients").textContent = new Set(cells.map((c) => c.client.id)).size;
    statGrid.style.display = "grid";

    if (currentView === "list") {
      renderListView(rows, container);
    } else {
      await renderTableView(cells, container);
    }
  }

  function renderListView(rows, container) {
    let html = "<table class='client-table'><thead><tr><th>Fecha</th><th>Cliente</th><th>Obligación</th><th>Periodo</th><th>Tipo</th></tr></thead><tbody>";
    rows.forEach((r) => {
      html += `<tr class="clickable" onclick="window.location.href='cliente.html?id=${r.client.id}'">
        <td class="name">${formatDate(r.date)}</td>
        <td>${escapeHtml(r.client.name)}${r.client.is_self ? ' <span class="badge residente">Tú</span>' : ""}</td>
        <td>${escapeHtml(r.obligation.name)}</td>
        <td>${escapeHtml(r.period)}</td>
        <td><span class="badge ${r.kind.startsWith('Domicil') ? 'residente' : 'fisica'}">${escapeHtml(r.kind)}</span></td>
      </tr>`;
    });
    html += "</tbody></table>";
    container.innerHTML = html;
  }

  async function renderTableView(cells, container) {
    container.innerHTML = "Cargando tabla…";

    // Columnas = obligaciones distintas (por obligación+periodo, ya que el mismo modelo
    // puede tener periodos distintos en meses raros; en la práctica casi siempre 1 periodo/mes)
    const obligationCols = [];
    const obligationColKey = (o, period) => o.id + "|" + period;
    const seenCols = new Set();
    cells.forEach((c) => {
      const key = obligationColKey(c.obligation, c.period);
      if (!seenCols.has(key)) { seenCols.add(key); obligationCols.push({ obligation: c.obligation, period: c.period }); }
    });
    obligationCols.sort((a, b) => a.obligation.name.localeCompare(b.obligation.name));

    const clientsMap = new Map();
    cells.forEach((c) => { clientsMap.set(c.client.id, c.client); });
    const clientsList = Array.from(clientsMap.values()).sort((a, b) => a.name.localeCompare(b.name));

    const cellSet = new Set(cells.map((c) => c.client.id + "|" + obligationColKey(c.obligation, c.period)));

    const clientIds = clientsList.map((c) => c.id);
    const { data: filings, error: filingsError } = await supabaseClient
      .from("obligation_filings")
      .select("*")
      .in("client_id", clientIds);
    if (filingsError) { container.textContent = "Error: " + filingsError.message; return; }

    const filedSet = new Set(
      (filings || []).filter((f) => f.filed).map((f) => f.client_id + "|" + f.obligation_type_id + "|" + f.period_label)
    );

    let html = "<div class='table-wrap'><table class='client-table'><thead><tr><th style='position:sticky;left:0;background:var(--paper);'>Cliente</th>";
    obligationCols.forEach((col) => {
      html += `<th style="text-align:center; white-space:nowrap;">${escapeHtml(col.obligation.name)}<div class="obl-meta" style="margin:2px 0 0;">${escapeHtml(col.period)}</div></th>`;
    });
    html += "</tr></thead><tbody>";

    clientsList.forEach((client) => {
      html += `<tr><td class="name" style="position:sticky;left:0;background:var(--paper);">${escapeHtml(client.name)}${client.is_self ? ' <span class="badge residente">Tú</span>' : ""}</td>`;
      obligationCols.forEach((col) => {
        const hasIt = cellSet.has(client.id + "|" + obligationColKey(col.obligation, col.period));
        if (!hasIt) {
          html += "<td style='text-align:center; color:var(--line);'>—</td>";
        } else {
          const filed = filedSet.has(client.id + "|" + col.obligation.id + "|" + col.period);
          html += `<td style="text-align:center;">
            <button class="filing-toggle${filed ? " filed" : ""}" data-client="${client.id}" data-obligation="${col.obligation.id}" data-period="${escapeHtml(col.period)}" title="${filed ? "Presentado — pulsa para desmarcar" : "Pendiente — pulsa al presentarlo"}">
              ${ICON_CHECK}
            </button>
          </td>`;
        }
      });
      html += "</tr>";
    });
    html += "</tbody></table></div><p class='sub' style='margin-top:14px;'>Pulsa el círculo al presentar un modelo — pasa a verde ✓. Vuelve a pulsar para desmarcarlo.</p>";

    container.innerHTML = html;

    container.querySelectorAll(".filing-toggle").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const clientId = btn.dataset.client;
        const obligationId = btn.dataset.obligation;
        const period = btn.dataset.period;
        const newFiled = !btn.classList.contains("filed");

        btn.disabled = true;
        const { error } = await supabaseClient
          .from("obligation_filings")
          .upsert(
            [{ client_id: clientId, obligation_type_id: obligationId, period_label: period, filed: newFiled, filed_date: newFiled ? new Date().toISOString().slice(0, 10) : null }],
            { onConflict: "client_id,obligation_type_id,period_label" }
          );
        btn.disabled = false;

        if (error) { toast("Error al guardar: " + error.message, "error"); return; }

        btn.classList.toggle("filed", newFiled);
        btn.title = newFiled ? "Presentado — pulsa para desmarcar" : "Pendiente — pulsa al presentarlo";
        document.getElementById("stat-pending").textContent = String(Number(document.getElementById("stat-pending").textContent) + (newFiled ? -1 : 1));
        document.getElementById("stat-filed").textContent = String(Number(document.getElementById("stat-filed").textContent) + (newFiled ? 1 : -1));
      });
    });
  }

  const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L19 7"/></svg>';

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }
</script>

</body>
